# =============================================================================
# sonar-project.properties — PingAPI (RabayHouseLab.PingApi)
# Scanner: dotnet-sonarscanner (Scanner for .NET — unico suportado para C#)
# Servidor: ../Sonarqube/docker-compose.yml
#   Host local (navegador / dotnet-sonarscanner): http://localhost:9000 [DEFAULT]
#   Dentro da rede Docker sonarqube-net:           http://sonarqube:9000
#   Via host.docker.internal (Windows/Mac sem rede compartilhada): http://host.docker.internal:9000
# Docs completas: ../Sonarqube/README.md
# Objetivo deste arquivo: deixar EXPLICITAS todas as propriedades necessarias
# para execucao, inclusive as que normalmente sao default/implicitas no SonarQube.
# =============================================================================

# ---------------------------------------------------------------------------
# 1) IDENTIFICACAO DO PROJETO (obrigatorias)
# ---------------------------------------------------------------------------
# projectKey deve ser exatamente a mesma criada em http://localhost:9000 -> Create Project -> Manually
sonar.projectKey=RabayHouseLab.PingApi
# projectName default = projectKey, aqui explicito
sonar.projectName=RabayHouseLab.PingApi
# projectVersion default = 1.0 (usado para marcar leak period / new code)
sonar.projectVersion=1.0
# Descricao opcional (default = vazio)
sonar.projectDescription=Web API .NET 10 - GET /ping -> { message: pong } - RabayHouseLab.PingApi
# Encoding default do sistema; explicito como UTF-8 (recomendado SonarSource)
sonar.sourceEncoding=UTF-8
# Diretorio base da analise (default = .  -> raiz onde esta este arquivo)
sonar.projectBaseDir=.
# Diretorio de trabalho do scanner (default = .scannerwork)
sonar.working.directory=.scannerwork

# ---------------------------------------------------------------------------
# 2) CONEXAO COM O SERVIDOR (explicitas mesmo quando default)
# ---------------------------------------------------------------------------
# URL do servidor SonarQube. Default do scanner = http://localhost:9000
# Para execucao DENTRO da rede sonarqube-net use http://sonarqube:9000
sonar.host.url=http://localhost:9000
# Autenticacao: prefira variavel de ambiente SONAR_TOKEN. Deixe explicito aqui
# que o token NAO deve ser commitado. Descomente apenas em ambiente local isolado.
# sonar.token=sqp_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
# Compatibilidade: sonar.login/sonar.password sao deprecated, usar sonar.token
# sonar.login=
# sonar.password=
# Timeout HTTP do scanner em segundos (default = 60)
sonar.ws.timeout=60
# URL externa do servidor vista por webhooks/PR decoration (default = sonar.host.url)
# sonar.core.serverBaseURL=http://localhost:9000

# ---------------------------------------------------------------------------
# 3) SCM - CONTROLE DE VERSAO (defaults explicitos)
# ---------------------------------------------------------------------------
# Provider SCM (default = auto-detect git). Explicito para reprodutibilidade.
sonar.scm.provider=git
# Habilita/desabilita integracao SCM (default = false -> habilitado)
sonar.scm.disabled=false
# Desabilita exclusao de arquivos ignorados pelo SCM (default = false)
sonar.scm.exclusions.disabled=false
# Revisao SCM para PR decoration (default = auto via git). Explicitar apenas em CI se necessario
# sonar.scm.revision=HEAD

# ---------------------------------------------------------------------------
# 4) ESCOPO DE ANALISE - SOURCES / TESTS (defaults explicitos)
# ---------------------------------------------------------------------------
# Pasta(s) de codigo produtivo. Default = .  (raiz). Aqui restrito a src/
sonar.sources=src
# Pasta(s) de testes. Default = vazio (sem separacao). Aqui explicito.
sonar.tests=tests
# Inclusoes (default = **/*  -> tudo dentro de sources/tests). Deixar vazio = default
sonar.inclusions=
sonar.test.inclusions=
# Exclusoes globais (default = vazio). Aqui explicitas para ignorar build artifacts
sonar.exclusions=**/bin/**,**/obj/**,**/artifacts/**,**/TestResults/**,**/coverage/**,**/coverage*/**,**/*.dll,**/*.exe,**/*.pdb,**/Migrations/**
sonar.test.exclusions=**/bin/**,**/obj/**,**/artifacts/**,**/TestResults/**,**/coverage/**
# Exclusoes especificas de cobertura e duplicacao (default = vazio)
sonar.coverage.exclusions=tests/**,**/*Tests/**,**/Program.cs,**/obj/**,**/bin/**,**/artifacts/**,**/*Designer.cs,**/*Generated*.cs,**/coverage/**
sonar.cpd.exclusions=tests/**,**/*Tests/**,**/Migrations/**,**/coverage/**
# Exclusoes globais adicionais (default = vazio)
sonar.global.exclusions=
sonar.global.test.exclusions=
# Limite de tamanho de arquivo em MB (default = 20). Arquivos maiores sao ignorados.
sonar.filesize.limit=20

# ---------------------------------------------------------------------------
# 5) DUPLICACAO (CPD) - defaults explicitos
# ---------------------------------------------------------------------------
# CPD ja habilitado por default; exclusoes acima controlam o escopo

# ---------------------------------------------------------------------------
# 6) COBERTURA DE TESTES (.NET) - 100% compativel SonarQube + diretorio padronizado (NATIVO .NET, SEM SCRIPTS)
# ---------------------------------------------------------------------------
# DIRETORIO PADRONIZADO: ./coverage/ na raiz do repositorio PingAPI
#   Garantido via RECURSOS NATIVOS .NET (sem scripts, sem apps externos):
#     1) coverlet.runsettings -> <RunConfiguration><ResultsDirectory>./coverage</ResultsDirectory></RunConfiguration>
#        + <Format>opencover</Format>  (APENAS OpenCover - compativel com dotnet-sonarscanner no Windows)
#     2) tests/RabayHouseLab.PingApi.Tests/RabayHouseLab.PingApi.Tests.csproj -> <VSTestResultsDirectory>$(MSBuildThisFileDirectory)../../coverage/</VSTestResultsDirectory>
#        (propriedade MSBuild nativa do Microsoft.NET.Test.Sdk/vstest; cobre execucao via `dotnet test` sem --settings)
#   Ambos apontam para o mesmo diretorio fisico padronizado. Qualquer `dotnet test --collect:"XPlat Code Coverage"`
#   gera em ./coverage/<guid>/coverage.opencover.xml sem precisar script.
#
# FORMATO UNICO - OpenCover -> sonar.cs.opencover.reportsPaths (plugin C# nativo, RECOMENDADO .NET)
#   Schema OpenCover validado pelo analisador C#. Gerado nativamente por coverlet.collector (Format=opencover).
#   NOTA: sonar.coverageReportPaths (generico) foi REMOVIDO - com wildcard ** causa
#   "Bad pathname" no GenericCoverageSensor no Windows com Scanner for .NET (WinNTFileSystem.canonicalize).
#   Use APENAS sonar.cs.opencover.reportsPaths / sonar.cs.vstest.reportsPaths.
#
# CAMINHO PADRONIZADO: wildcard em ./coverage/ (cobre subpasta GUID do vstest sem renomear)
sonar.cs.opencover.reportsPaths=coverage/**/coverage.opencover.xml
# sonar.coverageReportPaths desabilitado - ver nota acima (usar apenas opencover)
# NOTA: C# exige Scanner for .NET (sonar-analyze.ps1 via MSBuild/Roslyn).
# O SonarScanner CLI (sonarsource/sonar-scanner-cli) NAO suporta C# — docs.sonarsource.com.
# Formato Visual Studio Coverage XML (default = vazio) - nao usado, deixado explicito
sonar.cs.vscoveragexml.reportsPaths=
# Formato VSTest TRX (default = vazio) - para importar resultados de testes (nativo vstest em ./coverage/)
sonar.cs.vstest.reportsPaths=coverage/**/*.trx
# dotCover (JetBrains) - default vazio, explicito
sonar.cs.dotcover.reportsPaths=
# LCOV (JS/TS) - default = vazio (nao se aplica a este repo .NET, deixado explicito)
sonar.javascript.lcov.reportPaths=
sonar.typescript.lcov.reportPaths=

# ---------------------------------------------------------------------------
# 7) C# / .NET ESPECIFICO - defaults explicitos
# ---------------------------------------------------------------------------
# Analisar codigo gerado (default = false)
sonar.cs.analyzeGeneratedCode=false
# Ignorar issues do Roslyn (default = false)
sonar.cs.roslyn.ignoreIssues=false
# Paths de saida do analyzer Roslyn (default = auto-detect via MSBuild)
# sonar.cs.analyzer.projectOutPaths=
# Encoding ja definido globalmente, mas analisadores C# respeitam sourceEncoding

# ---------------------------------------------------------------------------
# 8) LINKS DO PROJETO (defaults = vazio)
# ---------------------------------------------------------------------------
sonar.links.homepage=
sonar.links.ci=
sonar.links.issue=
sonar.links.scm=https://github.com/RabayHouseLab/PingAPI-dotnet

# ---------------------------------------------------------------------------
# 9) QUALITY GATE / NEW CODE (defaults explicitos)
# ---------------------------------------------------------------------------
# Aguardar Quality Gate no scanner (default = false). Se true, falha o build se QG falhar.
sonar.qualitygate.wait=false
# Timeout em segundos ao aguardar QG (default = 300), so relevante se wait=true
sonar.qualitygate.timeout=300
# Definicao de New Code (default = previous_version). Outras opcoes: numberOfDays, referenceBranch
# sonar.newCode.referenceBranch=main

# ---------------------------------------------------------------------------
# 10) BRANCH / PULL REQUEST (plugin mc1arke/community-branch-plugin - defaults = vazio)
# ---------------------------------------------------------------------------
# NAO definir branch e PR ao mesmo tempo. Passar via -Branch / -PullRequestKey no script.
# Branch (ex.: feature/minha-feature)
# sonar.branch.name=main
# Pull Request (exemplo)
# sonar.pullrequest.key=42
# sonar.pullrequest.branch=feature/minha-feature
# sonar.pullrequest.base=main
# sonar.pullrequest.provider=github
# sonar.pullrequest.github.repository=RabayHouseLab/PingAPI-dotnet

# ---------------------------------------------------------------------------
# 11) LOGGING / DEBUG (defaults explicitos)
# ---------------------------------------------------------------------------
# Verbose (default = false)
sonar.verbose=false
# Nivel de log (default = INFO). Opcoes: INFO, DEBUG, TRACE
sonar.log.level=INFO
# Ignorar falhas do scanner (default = false)
# sonar.scanner.continueOnError=false

# ---------------------------------------------------------------------------
# 12) SEGURANCA / EXCLUSOES DE SEGURANCA (defaults = vazio)
# ---------------------------------------------------------------------------
# sonar.security.hotspot.timeout=

# ---------------------------------------------------------------------------
# EXEMPLO DE EXECUCAO — dotnet-sonarscanner (unico para C#)
# ---------------------------------------------------------------------------
# Requisitos nativos ja no repo: Microsoft.NET.Test.Sdk + coverlet.collector (XPlat Code Coverage)
# Configuracao nativa: coverlet.runsettings (ResultsDirectory=./coverage, Format=opencover)
#                + tests/...Tests.csproj (VSTestResultsDirectory=../../coverage/)
# Diretorio padronizado: ./coverage/<guid>/coverage.opencover.xml + ./coverage/**/*.trx
# Lido por: sonar.cs.opencover.reportsPaths=coverage/**/coverage.opencover.xml
#           sonar.cs.vstest.reportsPaths=coverage/**/*.trx
# C# exige Scanner for .NET (docs.sonarsource.com: CLI nao suporta C#).
#
# $env:SONAR_TOKEN="sqp_xxx"   # gere em http://localhost:9000 -> My Account -> Security -> Generate Tokens
# Remove-Item -Recurse -Force .sonarqube,coverage -ErrorAction SilentlyContinue
# dotnet sonarscanner begin /k:"RabayHouseLab.PingApi" /d:sonar.host.url="http://localhost:9000" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml" /d:sonar.cs.vstest.reportsPaths="coverage/**/*.trx"
# dotnet build --no-incremental
# dotnet test --collect:"XPlat Code Coverage" --settings coverlet.runsettings --logger "trx;LogFileName=test.trx" --results-directory ./coverage
# dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
# # Ou via script: ./sonar-analyze.ps1
